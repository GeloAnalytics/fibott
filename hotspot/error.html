<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />
<title>FiBott Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b1410;
    --bg-1:#0f1c16;
    --bg-2:#13241c;
    --surface:rgba(22, 38, 30, 0.55);
    --border-soft:rgba(168, 219, 188, 0.14);

    --leaf:#5FE08C;
    --leaf-dim:#3FAE6B;
    --leaf-glow:rgba(95, 224, 140, 0.35);

    --amber:#FFC857;

    --danger:#FF6B6B;
    --danger-dim:#E14B4B;
    --danger-bg:rgba(255, 107, 107, 0.10);
    --danger-border:rgba(255, 107, 107, 0.28);
    --danger-glow:rgba(255, 107, 107, 0.30);

    --text-hi:#EAF6EF;
    --text-mid:#A9C2B4;
    --text-low:#5E7569;

    --radius-lg:22px;
    --radius-md:14px;

    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text-hi);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,107,107,0.07), transparent 55%),
      radial-gradient(circle at 85% 88%, rgba(95,224,140,0.06), transparent 50%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    background-attachment:fixed;
  }

  body::before{
    content:"";
    position:fixed;
    inset:-20%;
    background:radial-gradient(38% 32% at 22% 18%, var(--danger-glow), transparent 70%);
    opacity:0.18;
    filter:blur(44px);
    animation:breathe 9s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes breathe{
    0%, 100% { opacity:0.12; transform:scale(1); }
    50%      { opacity:0.22; transform:scale(1.05); }
  }

  @media (prefers-reduced-motion: reduce){ body::before{ animation:none; } }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:370px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    padding:36px 30px 28px;
    text-align:center;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    animation:rise 0.6s var(--ease) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } }

  /* ---------- Icon ---------- */

  .icon-mark{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--danger-bg);
    border:1px solid var(--danger-border);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    animation:shake 0.5s var(--ease);
  }

  .icon-mark svg{ width:24px; height:24px; }

  @keyframes shake{
    0%, 100% { transform:translateX(0); }
    25%      { transform:translateX(-4px); }
    75%      { transform:translateX(4px); }
  }

  @media (prefers-reduced-motion: reduce){ .icon-mark{ animation:none; } }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0 0 12px;
    color:var(--text-hi);
  }

  p.message{
    color:var(--text-mid);
    font-size:14px;
    line-height:1.55;
    margin:0 0 26px;
  }

  /* ---------- Try again button ---------- */

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    border:none;
    border-radius:var(--radius-md);
    padding:16px 18px;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-decoration:none;
    color:#0A1810;
    background:linear-gradient(135deg, var(--leaf) 0%, var(--amber) 130%);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform 0.18s var(--ease), box-shadow 0.18s var(--ease), filter 0.18s var(--ease);
    box-shadow:0 10px 24px -8px rgba(95,224,140,0.45);
  }

  .btn:hover{
    filter:brightness(1.06);
    box-shadow:0 14px 30px -8px rgba(95,224,140,0.55);
  }

  .btn:active{
    transform:scale(0.97);
    box-shadow:0 6px 16px -6px rgba(95,224,140,0.45);
  }

  .btn:focus-visible{
    outline:2px solid var(--text-hi);
    outline-offset:3px;
  }

  .btn::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform:skewX(-20deg);
    transition:left 0.55s ease;
  }
  .btn:hover::after{ left:130%; }

  .btn svg{ width:15px; height:15px; flex-shrink:0; }

  /* ---------- Responsive ---------- */

  @media (max-width:380px){
    .card{ padding:30px 22px 24px; border-radius:18px; }
    h1{ font-size:18px; }
  }

  @media (min-width:480px){
    .card{ max-width:390px; padding:42px 36px 32px; }
  }
</style>
</head>
<body>

  <main class="card" role="alert">

    <div class="icon-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="#FF6B6B" stroke-width="2"/>
        <path d="M9.5 9.5l5 5M14.5 9.5l-5 5" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Something went wrong</h1>
    <p class="message">$(error)</p>

    <a href="$(link-login)" class="btn">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 12h13M13 6l6 6-6 6" stroke="#0A1810" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Try again
    </a>

  </main>

</body>
</html>
