<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="-1" />
<title>FiBott Logout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b1410;
    --bg-1:#0f1c16;
    --bg-2:#13241c;
    --surface:rgba(22, 38, 30, 0.55);
    --border-soft:rgba(168, 219, 188, 0.14);
    --border-strong:rgba(168, 219, 188, 0.28);

    --leaf:#5FE08C;
    --leaf-dim:#3FAE6B;
    --leaf-glow:rgba(95, 224, 140, 0.35);

    --amber:#FFC857;
    --amber-dim:#E0A93E;
    --amber-glow:rgba(255, 200, 87, 0.30);

    --text-hi:#EAF6EF;
    --text-mid:#A9C2B4;
    --text-low:#5E7569;

    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;

    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text-hi);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,200,87,0.08), transparent 55%),
      radial-gradient(circle at 85% 88%, rgba(95,224,140,0.08), transparent 50%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    background-attachment:fixed;
  }

  /* ambient glow — quieter than login, this is a resting state */
  body::before{
    content:"";
    position:fixed;
    inset:-20%;
    background:radial-gradient(38% 32% at 80% 18%, var(--amber-glow), transparent 70%);
    opacity:0.22;
    filter:blur(44px);
    animation:breathe 11s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes breathe{
    0%, 100% { opacity:0.16; transform:scale(1); }
    50%      { opacity:0.28; transform:scale(1.05); }
  }

  @media (prefers-reduced-motion: reduce){ body::before{ animation:none; } }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    padding:34px 30px 28px;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    animation:rise 0.6s var(--ease) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } }

  /* ---------- Header ---------- */

  .status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:6px;
  }

  .status-mark{
    width:34px;
    height:34px;
    border-radius:10px;
    background:linear-gradient(140deg, var(--text-low) 0%, #2C3A32 100%);
    border:1px solid var(--border-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .status-mark svg{ width:16px; height:16px; }

  h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0;
    color:var(--text-mid);
  }

  .subtitle{
    text-align:center;
    color:var(--text-low);
    font-size:13px;
    margin:0 0 22px;
  }

  /* ---------- Receipt ---------- */
  /* Signature element shared with login: the torn-ticket motif,
     now showing what was consumed instead of what to redeem. */

  .receipt{
    position:relative;
    border-radius:var(--radius-md);
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 6px,
        rgba(95,224,140,0.32) 6px, rgba(95,224,140,0.32) 12px
      ) left 0 / 2px 100% no-repeat,
      repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 6px,
        rgba(95,224,140,0.32) 6px, rgba(95,224,140,0.32) 12px
      ) right 0 / 2px 100% no-repeat,
      linear-gradient(180deg, #0E1F16 0%, #0A1810 100%);
    border:1px solid var(--border-soft);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
    padding:6px 18px;
  }

  .receipt::before,
  .receipt::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    background:var(--bg-1);
    border-radius:50%;
    top:50%;
    transform:translateY(-50%);
    box-shadow:0 0 0 1px var(--border-soft) inset;
  }
  .receipt::before{ left:-7px; }
  .receipt::after{ right:-7px; }

  .stat-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:13px 0;
    border-bottom:1px dashed var(--border-soft);
  }
  .stat-row:last-child{ border-bottom:none; }

  .stat-label{
    color:var(--text-mid);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.03em;
    white-space:nowrap;
  }

  .stat-value{
    font-family:'JetBrains Mono', monospace;
    color:var(--text-hi);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.01em;
    text-align:right;
    word-break:break-word;
  }

  .stat-value.accent{ color:var(--amber); }

  /* ---------- Re-login button ---------- */

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    border:none;
    border-radius:var(--radius-md);
    padding:16px 18px;
    margin-top:22px;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-decoration:none;
    color:#0A1810;
    background:linear-gradient(135deg, var(--leaf) 0%, var(--amber) 130%);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform 0.18s var(--ease), box-shadow 0.18s var(--ease), filter 0.18s var(--ease);
    box-shadow:0 10px 24px -8px rgba(95,224,140,0.45);
  }

  .btn:hover{
    filter:brightness(1.06);
    box-shadow:0 14px 30px -8px rgba(95,224,140,0.55);
  }

  .btn:active{
    transform:scale(0.97);
    box-shadow:0 6px 16px -6px rgba(95,224,140,0.45);
  }

  .btn:focus-visible{
    outline:2px solid var(--text-hi);
    outline-offset:3px;
  }

  .btn::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform:skewX(-20deg);
    transition:left 0.55s ease;
  }
  .btn:hover::after{ left:130%; }

  .btn svg{ width:15px; height:15px; flex-shrink:0; }

  /* ---------- Footer note ---------- */

  .note{
    margin-top:18px;
    text-align:center;
    font-size:11px;
    color:var(--text-low);
    line-height:1.5;
  }

  /* ---------- Responsive ---------- */

  @media (max-width:380px){
    .card{ padding:28px 22px 24px; border-radius:18px; }
    h2{ font-size:16px; }
    .stat-value{ font-size:13px; }
  }

  @media (min-width:480px){
    .card{ max-width:400px; padding:40px 36px 32px; }
  }
</style>
</head>
<body>

  <main class="card" role="main">

    <div class="status">
      <h2>Session ended</h2>
    </div>
    <p class="subtitle">Here's what you used.</p>

    <div class="receipt" role="group" aria-label="Session summary">
      <div class="stat-row">
        <span class="stat-label">Voucher</span>
        <span class="stat-value">$(username)</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Time used</span>
        <span class="stat-value">$(uptime)</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Data used</span>
        <span class="stat-value accent">$(bytes-out-nice)</span>
      </div>
    </div>

    <a href="$(link-login)" class="btn" aria-label="Log in again to start a new session">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 12h13M13 6l6 6-6 6" stroke="#0A1810" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Log in again
    </a>

    <p class="note">Need more time? Grab a new voucher from the machine.</p>

  </main>

</body>
</html>
