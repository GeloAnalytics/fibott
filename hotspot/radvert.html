<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="2; url=$(link-orig)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Internet hotspot - Advertisement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b1410;
    --bg-1:#0f1c16;
    --bg-2:#13241c;
    --surface:rgba(22, 38, 30, 0.55);
    --border-soft:rgba(168, 219, 188, 0.14);

    --leaf:#5FE08C;
    --leaf-glow:rgba(95, 224, 140, 0.35);
    --amber:#FFC857;

    --text-hi:#EAF6EF;
    --text-mid:#A9C2B4;
    --text-low:#5E7569;

    --radius-lg:22px;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--text-hi);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(95,224,140,0.10), transparent 55%),
      radial-gradient(circle at 85% 88%, rgba(255,200,87,0.07), transparent 50%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    background-attachment:fixed;
  }

  /* ie-fixMinHeight / main / wrap kept as structural classes from the
     original markup so any router-side CSS hooks still resolve */
  .ie-fixMinHeight{ width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .main{ width:100%; display:flex; align-items:center; justify-content:center; }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    padding:32px 28px 26px;
    text-align:center;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
    animation:rise 0.5s var(--ease) both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){ .wrap{ animation:none; } }

  .dots{
    display:flex;
    gap:6px;
    justify-content:center;
    margin-bottom:16px;
  }

  .dots span{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--leaf);
    opacity:0.3;
    animation:bounce 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay:0.15s; background:var(--amber); }
  .dots span:nth-child(3){ animation-delay:0.3s; }

  @keyframes bounce{
    0%, 100% { opacity:0.3; transform:translateY(0); }
    50%      { opacity:1; transform:translateY(-4px); }
  }

  @media (prefers-reduced-motion: reduce){ .dots span{ animation:none; opacity:0.8; } }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    margin:0 0 10px;
    color:var(--text-mid);
  }

  p.info{
    color:var(--text-low);
    font-size:13px;
    line-height:1.55;
    margin:0;
  }

  p.info a{
    color:var(--leaf);
    text-decoration:none;
    font-weight:600;
    border-bottom:1px solid transparent;
    transition:color 0.18s var(--ease), border-color 0.18s var(--ease);
  }

  p.info a:hover{
    color:var(--amber);
    border-bottom-color:var(--amber);
  }

  p.info a:focus-visible{
    outline:2px solid var(--leaf);
    outline-offset:2px;
    border-radius:3px;
  }

  @media (max-width:380px){
    .wrap{ padding:26px 22px 22px; border-radius:18px; }
    h1{ font-size:15px; }
  }
</style>
<script>

    var popup = '';
    function openOrig() {
	if (window.focus) popup.focus();
	location.href = unescape('$(link-orig-esc)');
    }
    function openAd() {
	location.href = unescape('$(link-redirect-esc)');
    }
    function openAdvert() {
	if (window.name != 'hotspot_advert') {
		popup = open('$(link-redirect)', 'hotspot_advert', '');
		setTimeout("openOrig()", 1000);
		return;
	}
	setTimeout("openAd()", 1000);
    }
</script>
</head>
<body onLoad="openAdvert()">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
                <h1>Advertisement</h1>
                <p class="info">If nothing happens, open <a href="$(link-redirect)" target="hotspot_advert">advertisement</a> manually.</p>
            </div>
        </div>
    </div>
</body>
</html>
